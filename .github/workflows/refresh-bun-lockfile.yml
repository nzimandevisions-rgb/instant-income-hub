name: Refresh Bun lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - bunfig.toml
      - .github/workflows/refresh-bun-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"
      - name: Refresh lockfile
        run: bun install
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: refresh bun lockfile [skip ci]"
          git push
